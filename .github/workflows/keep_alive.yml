name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 6 * * 1,4' # Körs automatiskt varje måndag och torsdag kl 06:00
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"