name: Keep Supabase Alive

on:
  workflow_dispatch:

  schedule:
    # Måndag och torsdag 06:00 UTC
    - cron: "0 6 * * 1,4"

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping database
        run: |
          curl --fail --silent --show-error \
            https://siminvest.vercel.app/api/keepalive